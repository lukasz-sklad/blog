[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/vectorcraft"
  to = "https://vectorcraft.lmk.one/"
  status = 301
  force = true

[[redirects]]
  from = "/vectorcraft/*"
  to = "https://vectorcraft.lmk.one/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/photocraft"
  to = "https://photocraft.lmk.one/"
  status = 301
  force = true

[[redirects]]
  from = "/photocraft/*"
  to = "https://photocraft.lmk.one/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/wordcraft"
  to = "https://wordcraft.lmk.one/"
  status = 301
  force = true

[[redirects]]
  from = "/wordcraft/*"
  to = "https://wordcraft.lmk.one/:splat"
  status = 301
  force = true


