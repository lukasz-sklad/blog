[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/vectorcraft"
  to = "https://vectorcraft.lmk.one/"
  status = 301
  force = true

[[redirects]]
  from = "/vectorcraft/*"
  to = "https://vectorcraft.lmk.one/:splat"
  status = 301
  force = true

